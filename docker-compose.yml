services:
  postgres:
    image: postgres:16
    container_name: dealscope-postgres

    environment:
      POSTGRES_USER: dealscope
      POSTGRES_PASSWORD: dealscope
      POSTGRES_DB: dealscope

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealscope -d dealscope"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: